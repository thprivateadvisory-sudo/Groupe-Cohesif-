name: Publication Réseaux Sociaux Quotidienne

on:
  schedule:
    # 9h Paris (8h UTC hiver / 7h UTC été)
    - cron: '0 8 * * *'
    # 17h Paris (16h UTC hiver / 15h UTC été)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      business_unit:
        description: 'Filiale à mettre en avant (optionnel, sinon rotation automatique)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'sport'
          - 'btp'
          - 'energy'
          - 'agro'
          - 'auto'
          - 'commerce'
          - 'leasing'
          - 'access'
          - 'net'
          - 'negoce'
          - 'groupe'
      post_slot:
        description: 'Créneau (morning=9h, evening=17h, auto=détection automatique)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'morning'
          - 'evening'

jobs:
  post-social-media:
    runs-on: ubuntu-latest
    name: Générer et publier le post du jour

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          pip install anthropic requests python-dateutil

      - name: Publication sur Facebook et LinkedIn
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          BUSINESS_UNIT_OVERRIDE: ${{ github.event.inputs.business_unit }}
          POST_SLOT: ${{ github.event.inputs.post_slot || 'auto' }}
        run: python social_media/post_generator.py

      - name: Sauvegarde du log de publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-log-${{ github.run_id }}
          path: social_media/publication_log.json
          retention-days: 30
